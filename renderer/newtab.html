<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <title>新标签页</title>
    <link rel="icon" href="../build/icon.png" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main>
      <img class="logo" src="../build/icon.png" alt="" draggable="false" />
      <h1>新标签页</h1>

      <form id="search" autocomplete="off">
        <input id="q" type="text" placeholder="搜索或输入网址，回车访问" spellcheck="false" aria-label="搜索" />
      </form>

      <nav class="tiles">
        <a class="tile" href="https://chat.deepseek.com/">
          <span class="dot red">D</span>
          <span class="name">DeepSeek 对话</span>
        </a>
        <a class="tile" href="https://platform.deepseek.com/">
          <span class="dot blue">平</span>
          <span class="name">开放平台</span>
        </a>
      </nav>

      <p class="tip">按 Ctrl+T 新建标签页 · Ctrl+W 关闭当前标签页</p>
    </main>

    <script src="newtab.js"></script>
  </body>
</html>
